<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winnie Pooh</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="escenario">

        <div class="winnie">

            <!-- Orejas -->
            <div class="oreja oreja-izquierda"></div>
            <div class="oreja oreja-derecha"></div>

            <!-- Cabeza -->
            <div class="cabeza">

                <div class="ojo ojo-izquierdo"></div>
                <div class="ojo ojo-derecho"></div>

                <!-- Hocico -->
                <div class="hocico">
                    <div class="nariz"></div>
                    <div class="boca"></div>
                </div>

            </div>

            <!-- Cuerpo -->
            <div class="cuerpo">

                <!-- Camisa -->
                <div class="camisa"></div>

                <!-- Brazos -->
                <div class="brazo brazo-izquierdo">
                    <div class="mano"></div>
                </div>

                <div class="brazo brazo-derecho">
                    <div class="mano"></div>
                </div>

                <!-- Barriga -->
                <div class="barriga"></div>

            </div>

            <!-- Piernas -->
            <div class="piernas">
                <div class="pierna pierna-izquierda"></div>
                <div class="pierna pierna-derecha"></div>
            </div>

            <!-- Pies -->
            <div class="pies">
                <div class="pie pie-izquierdo"></div>
                <div class="pie pie-derecho"></div>
            </div>

        </div>

    </div>

</body>
</html>
