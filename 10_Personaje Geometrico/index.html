<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winnie Pooh</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="pooh">

        <!-- OREJAS -->
        <div class="oreja izquierda"></div>
        <div class="oreja derecha"></div>

        <!-- CABEZA -->
        <div class="cabeza"></div>

        <!-- OJOS -->
        <div class="ojo izquierdo"></div>
        <div class="ojo derecho"></div>

        <!-- HOCICO -->
        <div class="hocico"></div>
        <div class="nariz"></div>
        <div class="boca"></div>

        <!-- CUERPO -->
        <div class="panza"></div>

        <!-- PIERNAS -->
        <div class="pierna izquierda"></div>
        <div class="pierna derecha"></div>

        <!-- PIES -->
        <div class="pie izquierdo"></div>
        <div class="pie derecho"></div>

        <!-- BRAZO IZQUIERDO -->
        <div class="brazo izquierdo">
            <div class="mano"></div>
        </div>

        <!-- BRAZO DERECHO ANIMADO -->
        <div class="brazo derecho">
            <div class="mano"></div>
        </div>

        <!-- CAMISA -->
        <div class="camisa"></div>

    </div>

</body>
</html>
