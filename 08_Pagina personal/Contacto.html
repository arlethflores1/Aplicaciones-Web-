            <div class="collapse navbar-collapse" id="menuContacto">

    <main class="seccion pagina-contacto">
    <div class="contenedor-contacto">

        <div class="columna-contacto">
            <h1>Contacto</h1>
            <p>¡Gracias por visitar mi portafolio!
            Puedes dejarme un mensaje.</p>

            <form class="formulario-contacto" action="#" method="get">
                <label for="nombre">Nombre:</label>
                <input class="form-control" type="text"
                    id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input class="form-control" type="email"
                    id="correo" name="correo" required>

                <label for="mensaje">Mensaje:</label>
                <textarea class="form-control" id="mensaje"
                    name="mensaje" rows="4" required></textarea>

                <button class="btn btn-warning mt-3" type="submit">
                    Enviar mensaje
                </button>
            </form>
        </div>

        <div class="columna-ubicacion">
            <h2>Ubicación</h2>
            <p>Consulta el mapa para ver la ubicación.</p>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1417.5770392058664!2d-101.6653869540762!3d21.08254672862502!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x842bbfcde8ad96e1%3A0xa1668ea89258ce39!2sStiva%20Le%C3%B3n%20Industrial%20Park!5e0!3m2!1ses!2smx!4v1792972272350!5m2!1ses!2smx" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </div>
</main>
